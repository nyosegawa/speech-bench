[project]
name = "speech-bench-irodori-tts"
version = "0"
description = "Irodori-TTS's official PyTorch runtime behind speech.cpp's worker protocol, for speech-bench"
requires-python = ">=3.10,<3.11"
dependencies = [
  "irodori-tts @ git+https://github.com/Aratako/Irodori-TTS@89f9d8fbd4d51ea019867ee1197725ede1df13c5",
  # Irodori-TTS names these two by URL in its own sources, which uv honours only at the root.
  "dacvae @ git+https://github.com/facebookresearch/dacvae@414c20785fc3a28373073ea8ef7a1316eeeaca6e",
  "silentcipher @ git+https://github.com/SesameAILabs/silentcipher.git@d46d7d0893a583d8968ab3a6626e2289faec9152",
  "torch==2.10.0",
  "torchaudio==2.10.0",
  "torchcodec==0.10.0",
  "transformers==5.12.1",
  "numpy",
]

[tool.uv]
package = false
