[project]
name = "speech-bench-transformers-asr"
version = "0"
description = "Speech recognition models in transformers, each run as its model card runs it, behind speech.cpp's worker protocol, for speech-bench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "transformers==5.22.0",
  "torch==2.10.0",
  # Granite Speech's feature extractor computes its mel spectrogram with torchaudio.
  "torchaudio==2.10.0",
  "accelerate==1.15.0",
  # Voxtral Realtime's processor reads its tekken tokenizer through mistral-common.
  "mistral-common[audio]==1.13.0",
  # Cohere Transcribe's feature extractor requires librosa.
  "librosa==1.0.0",
  "sentencepiece==0.2.2",
  "protobuf",
  "numpy",
]

[tool.uv]
# The lock file is made and run with uv 0.11; older releases are not checked against it.
required-version = ">=0.11"
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]
