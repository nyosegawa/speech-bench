[project]
name = "speech-bench-nemo-speech-converter"
version = "0"
description = "The packages NeMo-Speech.cpp's convert_model.py imports to convert an ASR checkpoint, for speech-bench"
requires-python = ">=3.12,<3.13"
# The converter's requirements.txt names these for every family it converts, torch without a version; an ASR
# checkpoint needs these alone, pinned so that the converted file is the same byte for byte.
dependencies = [
  "gguf==0.19.0",
  "librosa==0.11.0",
  "numpy==1.26.4",
  "pyyaml==6.0.3",
  "sentencepiece==0.2.2",
  "torch==2.14.1",
]

[tool.uv]
package = false
