[project]
name = "speech-bench-nemo-speech-builder"
version = "0"
description = "CMake and Ninja, which build NeMo-Speech.cpp from a pinned commit, for speech-bench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cmake==4.1.2",
  "ninja==1.13.0",
]

[tool.uv]
# The lock file is made and run with uv 0.11; older releases are not checked against it.
required-version = ">=0.11"
package = false
# The bench builds NeMo-Speech.cpp on a Mac alone, with Metal.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
