<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · speech-bench listening</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f4; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #deded8; --track: #ecece8; --primary: #1d4ed8; --on-primary: #ffffff; --star: #b45309;
    --good: #15803d; --good-bg: #dcfce7; --bad: #b91c1c; --bad-bg: #fee2e2;
    --c0: #2563eb; --c1: #c2410c; --c2: #15803d; --c3: #9333ea; --c4: #be123c; --c5: #0e7490; --c6: #a16207; --c7: #4d7c0f; --c8: #7c3aed; --c9: #475569;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #22221f; --text: #ececea; --muted: #a3a39c; --line: #3a3a36; --track: #2e2e2a; --primary: #60a5fa; --on-primary: #0b1220; --star: #fbbf24;
      --good: #4ade80; --good-bg: #14361f; --bad: #f87171; --bad-bg: #3f1717;
      --c0: #60a5fa; --c1: #fb923c; --c2: #4ade80; --c3: #c084fc; --c4: #fb7185; --c5: #22d3ee; --c6: #facc15; --c7: #a3e635; --c8: #a78bfa; --c9: #94a3b8;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, sans-serif; }
  .inner { max-width: 1100px; margin: 0 auto; padding: 12px 16px; }
  .bar { position: sticky; top: 0; z-index: 2; background: var(--card); border-bottom: 1px solid var(--line); box-shadow: 0 2px 8px rgb(0 0 0 / .06); }
  h1 { font-size: 17px; margin: 0; }
  h2 { font-size: 16px; margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  .runs { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .run { flex: none; display: flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; border: 1px solid var(--line); border-left: 5px solid var(--color); border-radius: 10px; white-space: nowrap; }
  .run.starred { background: color-mix(in srgb, var(--star) 12%, transparent); border-color: var(--star); border-left-color: var(--color); }
  .run .name { font-weight: 650; font-size: 14px; margin-right: 4px; }
  .run button { padding: 1px 8px; font-size: 14px; }
  .star { color: var(--muted); }
  .starred .star { color: var(--star); }
  .play-run { background: var(--color); border-color: var(--color); color: var(--card); font-weight: 650; }
  .now { display: flex; gap: 10px; align-items: center; margin-top: 8px; min-height: 34px; font-size: 14px; }
  .now .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .now .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--color, var(--muted)); flex: none; }
  main { max-width: 1100px; margin: 0 auto; padding: 4px 16px 64px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-top: 14px; }
  .card.active { border-color: var(--primary); }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .scroll { overflow-x: auto; margin-top: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; }
  th.sorted::after { content: ' ▾'; }
  th.sorted.up::after { content: ' ▴'; }
  td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  td.voice { border-left: 5px solid var(--color); min-width: 220px; }
  td.voice b { display: block; }
  td.voice small { display: block; color: var(--muted); font-size: 12px; line-height: 1.4; }
  td.num { white-space: nowrap; }
  td.good { background: var(--good-bg); color: var(--good); font-weight: 650; }
  td.bad { background: var(--bad-bg); color: var(--bad); font-weight: 650; }
  .meter { display: block; height: 4px; margin-top: 3px; border-radius: 2px; background: var(--track); overflow: hidden; min-width: 60px; }
  .meter > span { display: block; height: 100%; background: currentColor; }
  td .play-row { padding: 2px 8px; font-size: 13px; white-space: nowrap; }
  .legend { margin-top: 8px; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; margin-top: 16px; }
  .chart h3 { font-size: 13px; margin: 0 0 4px; }
  .chart .row { display: grid; grid-template-columns: 150px 1fr; align-items: center; height: 22px; }
  .chart .label { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 6px; color: var(--color); font-weight: 650; }
  .chart .track { position: relative; height: 22px; border-top: 1px dashed var(--line); top: 11px; }
  .chart .point { position: absolute; top: -6px; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; background: var(--color); opacity: .8; padding: 0; border: 1px solid var(--card); cursor: pointer; }
  .chart .point:hover { opacity: 1; transform: scale(1.4); }
  .chart .axis { position: relative; height: 18px; margin-left: 150px; font-size: 11px; color: var(--muted); }
  .chart .axis span { position: absolute; transform: translateX(-50%); }
  .text { font-size: 20px; line-height: 1.7; margin: 6px 0 10px; }
  .row-play { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-weight: 650; }
  .takes { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
  .take { position: relative; overflow: hidden; text-align: left; padding: 8px 10px 10px; border-left: 5px solid var(--color); }
  .take b { display: block; overflow-wrap: anywhere; line-height: 1.35; }
  .take small { display: block; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .take small .bad { color: var(--bad); font-weight: 650; }
  .take .progress { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--color); }
  .take.playing { background: color-mix(in srgb, var(--color) 14%, var(--card)); border-color: var(--color); }
  .take.missing { opacity: .45; cursor: default; }
  details { margin-top: 24px; }
  kbd { font: 12px ui-monospace, monospace; padding: 0 4px; border: 1px solid var(--line); border-radius: 4px; }
</style>
</head>
<body>
<header class="bar">
  <div class="inner">
    <h1 id="title"></h1>
    <div id="shared" class="muted"></div>
    <div id="runs" class="runs"></div>
    <div class="now">
      <span id="dot" class="dot"></span>
      <span id="what" class="what muted">Play a voice's sentences in a row to hear whether it stays the same voice, or one sentence in every voice to compare them. <kbd>Esc</kbd> stops.</span>
      <button id="stop" hidden>Stop</button>
    </div>
  </div>
</header>
<main>
  <section id="summary" class="card" hidden></section>
  <div id="sentences"></div>
</main>
<script id="data" type="application/json">__DATA__</script>
<script type="module">
const data = JSON.parse(document.getElementById('data').textContent)
/**
 * Where a figure turns good or bad. The sameness of voice and the pitch spread are read against measured
 * voices (2026-10-01): one real speaker's recordings 0.84 alike and 0.33 like other men's, Qwen3-TTS's ono_anna
 * 0.76 with a pitch spread of 1.5 to 1.8 semitones, and Irodori-TTS without a voice description 0.47 to
 * 0.57 with 3.6 to 6.6. A sentence heard with more than 30% of its characters wrong has broken down.
 */
const LIMITS = { sameGood: 0.72, sameBad: 0.58, spreadGood: 2, spreadBad: 3, cerGood: 0.01, cerBad: 0.05, broken: 0.3, oddTake: 0.5 }
const $ = (id) => document.getElementById(id)
const colorOf = (run) => `var(--c${run % 10})`
const percent = (rate) => `${(rate * 100).toFixed(1)}%`
const element = (tag, properties = {}, children = []) => {
  const node = Object.assign(document.createElement(tag), properties)
  node.append(...children)
  return node
}
const player = new Audio()
let queue = []
let current = null

const storageKey = (run) => `speech-bench-listen:${data.title}:${data.blind ? 'blind' : 'named'}:${data.runs[run].name}`
function starred(run) {
  try { return localStorage.getItem(storageKey(run)) === '1' } catch { return false }
}
function setStarred(run, on) {
  try { on ? localStorage.setItem(storageKey(run), '1') : localStorage.removeItem(storageKey(run)) } catch {}
}

const allOf = (run) => data.sentences.map((_, sentence) => ({ sentence, run }))
const brokenIn = (run) => data.sentences.filter((sentence) => (sentence.takes[run]?.heardErrorRate ?? 0) > LIMITS.broken).length

function takeButton(sentence, run) {
  return document.querySelector(`.take[data-sentence="${sentence}"][data-run="${run}"]`)
}

function show() {
  document.querySelectorAll('.take.playing').forEach((node) => node.classList.remove('playing'))
  document.querySelectorAll('.take .progress').forEach((node) => { node.style.width = '0' })
  document.querySelectorAll('.card.active').forEach((node) => node.classList.remove('active'))
  $('stop').hidden = !current
  if (!current) {
    $('dot').style.removeProperty('--color')
    $('what').textContent = 'Stopped.'
    return
  }
  const { sentence, run } = current
  const take = data.sentences[sentence].takes[run]
  takeButton(sentence, run).classList.add('playing')
  const card = $(`sentence-${sentence}`)
  card.classList.add('active')
  // The bar at the top covers the page under it, so a card is brought to just below the bar.
  const below = document.querySelector('.bar').getBoundingClientRect().bottom + 8
  const box = card.getBoundingClientRect()
  if (box.top < below || box.bottom > innerHeight) window.scrollBy({ top: box.top - below, behavior: 'smooth' })
  $('dot').style.setProperty('--color', colorOf(run))
  const heard = take.transcript === undefined ? '' : ` — heard: ${take.transcript}`
  $('what').textContent = `${data.runs[run].name} · ${data.sentences[sentence].text}${heard}`
}

function next() {
  current = queue.shift() ?? null
  if (current) {
    player.src = data.sentences[current.sentence].takes[current.run].url
    player.play().catch(() => stop())
  } else {
    player.pause()
  }
  show()
}

function play(items) {
  queue = items.filter(({ sentence, run }) => data.sentences[sentence].takes[run])
  next()
}

function stop() {
  queue = []
  current = null
  player.pause()
  show()
}

player.onended = next
player.ontimeupdate = () => {
  if (!current || !player.duration) return
  takeButton(current.sentence, current.run).querySelector('.progress').style.width = `${(player.currentTime / player.duration) * 100}%`
}

function renderRuns() {
  $('runs').replaceChildren(...data.runs.map((run, index) => {
    const chip = element('div', { className: `run${starred(index) ? ' starred' : ''}`, title: run.instruction ?? run.name }, [
      element('span', { className: 'name', textContent: run.name }),
      element('button', { className: 'play-run', textContent: '▶', title: `Play every sentence as ${run.name} spoke it`, onclick: () => play(allOf(index)) }),
      element('button', { className: 'star', textContent: starred(index) ? '★' : '☆', title: 'Mark the voices you like', onclick: () => { setStarred(index, !starred(index)); renderRuns(); renderSummary() } })
    ])
    chip.style.setProperty('--color', colorOf(index))
    return chip
  }))
}

/** A figure as a table cell, green or red where it passes a limit, with a bar when it has a scale. */
function figure(text, verdict, share) {
  const cell = element('td', { className: `num${verdict ? ` ${verdict}` : ''}` }, [text])
  if (share !== undefined) cell.append(element('span', { className: 'meter' }, [Object.assign(element('span'), { style: `width: ${Math.max(0, Math.min(1, share)) * 100}%` })]))
  return cell
}

const judge = (value, good, bad, higherIsBetter) => (higherIsBetter ? (value >= good ? 'good' : value < bad ? 'bad' : '') : (value <= good ? 'good' : value >= bad ? 'bad' : ''))

const COLUMNS = [
  { label: 'Voice', value: (index) => index, higherIsBetter: false },
  { label: 'Same voice', value: (index) => data.runs[index].sameVoice, higherIsBetter: true,
    cell: (run) => figure(run.sameVoice.toFixed(2), judge(run.sameVoice, LIMITS.sameGood, LIMITS.sameBad, true), run.sameVoice) },
  ...(data.runs.some((run) => run.likeReference !== null && run.likeReference !== undefined) ? [{ label: data.reference ? `Like ${data.reference}` : 'Like its reference', value: (index) => data.runs[index].likeReference ?? 0, higherIsBetter: true,
    cell: (run) => figure(run.likeReference === null ? '–' : run.likeReference.toFixed(2), run.likeReference === null ? '' : judge(run.likeReference, LIMITS.sameGood, LIMITS.sameBad, true), run.likeReference ?? 0) }] : []),
  { label: 'Pitch spread', value: (index) => data.runs[index].pitchSpread, higherIsBetter: false,
    cell: (run) => figure(`${run.pitchSpread.toFixed(1)} st`, judge(run.pitchSpread, LIMITS.spreadGood, LIMITS.spreadBad, false), run.pitchSpread / 6) },
  { label: 'Pitch', value: (index) => data.runs[index].pitchHz ?? 0, higherIsBetter: true,
    cell: (run) => figure(run.pitchHz ? `${Math.round(run.pitchHz)} Hz` : '–', '') },
  { label: 'Heard CER', value: (index) => data.runs[index].heardErrorRate, higherIsBetter: false,
    cell: (run) => figure(percent(run.heardErrorRate), judge(run.heardErrorRate, LIMITS.cerGood, LIMITS.cerBad, false)) },
  { label: 'Broken', value: (index) => brokenIn(index), higherIsBetter: false,
    cell: (run, index) => figure(String(brokenIn(index)), brokenIn(index) === 0 ? 'good' : 'bad') },
  { label: 'First audio', value: (index) => data.runs[index].medianFirstAudioSeconds, higherIsBetter: false,
    cell: (run) => figure(`${run.medianFirstAudioSeconds.toFixed(2)} s`, '') }
]
let sort = { column: 0, up: true }

function renderSummary() {
  if (data.blind) return
  const order = data.runs.map((_, index) => index).sort((a, b) => {
    const { value } = COLUMNS[sort.column]
    return (value(a) - value(b)) * (sort.up ? 1 : -1)
  })
  const header = element('tr', {}, [...COLUMNS.map((column, index) => element('th', {
    className: sort.column === index ? `sorted${sort.up ? ' up' : ''}` : '',
    textContent: column.label,
    title: 'Sort by this column',
    onclick: () => { sort = { column: index, up: sort.column === index ? !sort.up : column.higherIsBetter === false }; renderSummary() }
  })), element('th', { textContent: '' })])
  const rows = order.map((index) => {
    const run = data.runs[index]
    const voice = element('td', { className: 'voice' }, [element('b', { textContent: `${starred(index) ? '★ ' : ''}${run.name}` })])
    if (run.instruction) voice.append(element('small', { textContent: run.instruction }))
    voice.style.setProperty('--color', colorOf(index))
    const row = element('tr', {}, [voice, ...COLUMNS.slice(1).map((column) => column.cell(run, index)),
      element('td', {}, [element('button', { className: 'play-row', textContent: '▶ All', onclick: () => play(allOf(index)) })])])
    row.style.setProperty('--color', colorOf(index))
    return row
  })
  $('summary').hidden = false
  $('summary').replaceChildren(
    element('div', { className: 'head' }, [element('h2', { textContent: 'Summary' }), element('span', { className: 'muted', textContent: 'Click a column to sort. Green passes, red fails.' })]),
    element('div', { className: 'scroll' }, [element('table', {}, [element('thead', {}, [header]), element('tbody', {}, rows)])]),
    element('p', { className: 'legend', textContent: 'Same voice: the mean similarity of the speaker embeddings (3D-Speaker ERes2NetV2) of every pair of sentences with 1.5 s of voice or more; one real speaker is 0.84, and 0.33 against other men, Qwen3-TTS\'s ono_anna 0.76, and Irodori-TTS without a voice description, whose voice changes between sentences, 0.47 to 0.57. Pitch spread: the standard deviation of the sentences\' median pitch in semitones; ono_anna 1.5 to 1.8, a changing voice 3.6 to 6.6. Broken: sentences heard with more than 30% of their characters wrong.' }),
    element('div', { className: 'charts' }, [
      chart('Pitch of each sentence', (take) => take.pitchHz, (hz) => (Math.log(hz) - Math.log(70)) / (Math.log(400) - Math.log(70)), [100, 150, 200, 300].map((hz) => [hz, `${hz} Hz`]), (value) => `${Math.round(value)} Hz`),
      chart('How much each sentence sounds like the rest', (take) => take.likeness, (value) => value, [0, 0.25, 0.5, 0.75, 1].map((value) => [value, String(value)]), (value) => value.toFixed(2))
    ])
  )
}

/** One row per voice with a point per sentence, so that a voice that holds shows as a tight cluster. */
function chart(title, valueOf, place, ticks, format) {
  const rows = data.runs.map((run, index) => {
    const points = data.sentences.flatMap((sentence, which) => {
      const take = sentence.takes[index]
      const value = take ? valueOf(take) : null
      if (value === null || value === undefined) return []
      const point = element('button', { className: 'point', title: `${sentence.text} — ${format(value)}`, onclick: () => play([{ sentence: which, run: index }]) })
      point.style.left = `${Math.max(0, Math.min(1, place(value))) * 100}%`
      return [point]
    })
    const row = element('div', { className: 'row' }, [element('span', { className: 'label', textContent: run.name, title: run.name }), element('div', { className: 'track' }, points)])
    row.style.setProperty('--color', colorOf(index))
    return row
  })
  const axis = element('div', { className: 'axis' }, ticks.map(([value, label]) => Object.assign(element('span', { textContent: label }), { style: `left: ${place(value) * 100}%` })))
  return element('div', { className: 'chart' }, [element('h3', { textContent: title }), ...rows, axis])
}

function renderSentences() {
  $('sentences').replaceChildren(...data.sentences.map((sentence, index) => {
    const takes = sentence.takes.map((take, run) => {
      const details = element('small')
      if (!take) details.textContent = 'not spoken'
      else if (take.heardErrorRate === undefined) details.textContent = `${take.seconds.toFixed(1)} s`
      else {
        const likeness = take.likeness === null
          ? element('span', { textContent: 'too short to judge', title: 'Less than 1.5 s of voice, too little for a speaker embedding' })
          : element('span', { className: take.likeness < LIMITS.oddTake ? 'bad' : '', textContent: `like the rest ${take.likeness.toFixed(2)}` })
        const broken = take.heardErrorRate > LIMITS.broken
        const likeReference = take.likeReference === null || take.likeReference === undefined ? '' : ` · like ${data.reference ?? 'its reference'} ${take.likeReference.toFixed(2)}`
        details.append(`${take.seconds.toFixed(1)} s${take.pitchHz ? ` · ${Math.round(take.pitchHz)} Hz` : ''} · `, likeness, `${likeReference} · `,
          element('span', { className: broken ? 'bad' : '', textContent: `CER ${percent(take.heardErrorRate)}` }))
      }
      const button = element('button', {
        className: `take${take ? '' : ' missing'}`,
        disabled: !take,
        title: take?.transcript ? `heard: ${take.transcript}` : '',
        onclick: () => play([{ sentence: index, run }])
      }, [element('b', { textContent: `▶ ${data.runs[run].name}` }), details, element('span', { className: 'progress' })])
      button.dataset.sentence = index
      button.dataset.run = run
      button.style.setProperty('--color', colorOf(run))
      return button
    })
    return element('section', { className: 'card', id: `sentence-${index}` }, [
      element('div', { className: 'head' }, [
        element('span', { className: 'muted', textContent: `${index + 1} of ${data.sentences.length} · ${sentence.kind} · ${sentence.id}` }),
        element('button', { className: 'row-play', textContent: '▶ Every voice', title: 'Play this sentence in every voice, one after another', onclick: () => play(sentence.takes.map((_, run) => ({ sentence: index, run }))) })
      ]),
      element('p', { className: 'text', textContent: sentence.text }),
      element('div', { className: 'takes' }, takes)
    ])
  }))
  if (data.key) {
    $('sentences').append(element('details', {}, [element('summary', { textContent: 'Which voice is which' }), element('ul', {}, data.key.map((line) => element('li', { textContent: line })))]))
  }
}

$('title').textContent = data.title
$('shared').textContent = [data.shared, `${data.runs.length} voices, ${data.sentences.length} sentences`, data.blind ? 'names hidden and order shuffled' : ''].filter(Boolean).join(' · ')
$('stop').onclick = stop
document.addEventListener('keydown', (event) => { if (event.key === 'Escape') stop() })
renderRuns()
renderSummary()
renderSentences()
</script>
</body>
</html>
