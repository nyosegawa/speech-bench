<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · speech-bench voices</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f4; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #deded8; --track: #ecece8; --primary: #1d4ed8; --on-primary: #ffffff;
    --good: #15803d; --good-bg: #dcfce7; --bad: #b91c1c; --bad-bg: #fee2e2; --heat-low: #f1f5f9; --heat-high: #1e3a8a;
    --c0: #2563eb; --c1: #c2410c; --c2: #15803d; --c3: #9333ea; --c4: #be123c; --c5: #0e7490;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #22221f; --text: #ececea; --muted: #a3a39c; --line: #3a3a36; --track: #2e2e2a; --primary: #60a5fa; --on-primary: #0b1220;
      --good: #4ade80; --good-bg: #14361f; --bad: #f87171; --bad-bg: #3f1717; --heat-low: #1e1e1c; --heat-high: #93c5fd;
      --c0: #60a5fa; --c1: #fb923c; --c2: #4ade80; --c3: #c084fc; --c4: #fb7185; --c5: #22d3ee;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, sans-serif; }
  .inner { max-width: 1200px; margin: 0 auto; padding: 12px 16px; }
  .bar { position: sticky; top: 0; z-index: 2; background: var(--card); border-bottom: 1px solid var(--line); box-shadow: 0 2px 8px rgb(0 0 0 / .06); }
  h1 { font-size: 17px; margin: 0; }
  h2 { font-size: 16px; margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  .now { display: flex; gap: 10px; align-items: center; margin-top: 6px; min-height: 32px; font-size: 14px; }
  .now .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .now .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--color, var(--muted)); flex: none; }
  main { max-width: 1200px; margin: 0 auto; padding: 4px 16px 64px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-top: 14px; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .scroll { overflow-x: auto; margin-top: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
  tr.selected td:first-child { box-shadow: inset 4px 0 var(--primary); }
  td.name { font-weight: 650; }
  td.name button { font-weight: 650; border: none; padding: 0; background: none; text-align: left; }
  td.name button:hover { text-decoration: underline; }
  td.good { background: var(--good-bg); color: var(--good); font-weight: 650; }
  td.bad { background: var(--bad-bg); color: var(--bad); font-weight: 650; }
  .chips { display: flex; gap: 4px; }
  .chip { min-width: 34px; padding: 2px 8px; border-left: 4px solid var(--color); }
  .chip.chosen { background: var(--color); color: var(--card); font-weight: 700; border-color: var(--color); }
  .chip .best { font-size: 10px; vertical-align: super; }
  .actions { display: flex; gap: 4px; }
  .actions button { padding: 2px 8px; font-size: 13px; }
  .legend { margin-top: 8px; font-size: 12px; color: var(--muted); line-height: 1.5; white-space: normal; }
  .matrix td, .matrix th { text-align: center; padding: 4px 6px; }
  .matrix th.row { text-align: left; }
  .matrix td.cell { cursor: pointer; min-width: 44px; }
  .matrix td.cell.alike { outline: 2px solid var(--bad); outline-offset: -2px; }
  .matrix td.self { font-style: italic; }
  pre { margin: 8px 0 0; padding: 8px 10px; background: var(--track); border-radius: 8px; font-size: 12px; white-space: pre-wrap; }
  .text { font-size: 18px; line-height: 1.6; margin: 4px 0 8px; }
  .takes { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
  .take { position: relative; overflow: hidden; text-align: left; padding: 6px 10px 8px; border-left: 5px solid var(--color); }
  .take b { display: block; }
  .take small { display: block; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .take small .bad { color: var(--bad); font-weight: 650; }
  .take.playing, button.playing { background: color-mix(in srgb, var(--color, var(--primary)) 16%, var(--card)); border-color: var(--color, var(--primary)); }
  .take.chosen b::after { content: ' ✓'; }
  kbd { font: 12px ui-monospace, monospace; padding: 0 4px; border: 1px solid var(--line); border-radius: 4px; }
  @media (max-width: 640px) { .text { font-size: 16px; } }
</style>
</head>
<body>
<header class="bar">
  <div class="inner">
    <h1 id="title"></h1>
    <div id="shared" class="muted"></div>
    <div class="now">
      <span id="dot" class="dot"></span>
      <span id="what" class="what muted">Choose one candidate for each voice. Click a number to choose it, a voice's name to hear its candidates sentence by sentence. <kbd>Esc</kbd> stops.</span>
      <button id="stop" hidden>Stop</button>
    </div>
  </div>
</header>
<main>
  <section id="voices" class="card"></section>
  <section id="alike" class="card"></section>
  <section id="detail" class="card"></section>
  <div id="sentences"></div>
</main>
<script id="data" type="application/json">__DATA__</script>
<script type="module">
const data = JSON.parse(document.getElementById('data').textContent)
/**
 * Where a figure turns good or bad, as on the listening page. Two voices are marked alike at 0.8, the
 * similarity at which takes of one description were heard as one voice (2026-10-01); one real speaker's
 * recordings are 0.84 alike, and the author's 0.33 like other men's.
 */
const LIMITS = { sameGood: 0.72, sameBad: 0.58, cerGood: 0.01, cerBad: 0.05, broken: 0.3, alike: 0.8 }
const SCALE = { low: 0.2, high: 0.9 }
const $ = (id) => document.getElementById(id)
const element = (tag, properties = {}, children = []) => {
  const node = Object.assign(document.createElement(tag), properties)
  node.append(...children)
  return node
}
const percent = (rate) => `${(rate * 100).toFixed(1)}%`
const fixed = (value) => (value === null || value === undefined ? '–' : value.toFixed(2))
const judge = (value, good, bad, higherIsBetter) => (value === null ? '' : higherIsBetter ? (value >= good ? 'good' : value < bad ? 'bad' : '') : (value <= good ? 'good' : value >= bad ? 'bad' : ''))
const positionIn = (candidate) => data.voices.find((voice) => voice.candidates.includes(candidate)).candidates.indexOf(candidate)
const colorOf = (candidate) => `var(--c${positionIn(candidate) % 6})`
const label = (candidate) => String(positionIn(candidate) + 1)

const storageKey = (voice) => `speech-bench-voices:${data.title}:${data.voices[voice].name}`
function chosenOf(voice) {
  try {
    const name = localStorage.getItem(storageKey(voice))
    const found = data.voices[voice].candidates.find((candidate) => data.candidates[candidate].name === name)
    if (found !== undefined) return found
  } catch {}
  return data.voices[voice].best
}
function choose(voice, candidate) {
  try { localStorage.setItem(storageKey(voice), data.candidates[candidate].name) } catch {}
  render()
}
let selected = 0

const player = new Audio()
let queue = []
let current = null
function play(items) {
  queue = items.filter((item) => item.url)
  next()
}
function next() {
  document.querySelectorAll('.playing').forEach((node) => node.classList.remove('playing'))
  current = queue.shift() ?? null
  $('stop').hidden = !current
  if (!current) {
    player.pause()
    $('dot').style.removeProperty('--color')
    $('what').textContent = 'Stopped.'
    return
  }
  player.src = current.url
  player.play().catch(() => stop())
  $('dot').style.setProperty('--color', current.color ?? 'var(--muted)')
  $('what').textContent = current.what
  if (current.key) document.querySelectorAll(`[data-key="${current.key}"]`).forEach((node) => node.classList.add('playing'))
}
function stop() {
  queue = []
  next()
}
player.onended = next

const voiceName = (voice) => data.voices[voice].name
const voiceOf = (candidate) => data.voices.findIndex((voice) => voice.candidates.includes(candidate))
const referenceItem = (candidate) => ({ url: data.candidates[candidate].reference.url, color: colorOf(candidate), key: `reference-${candidate}`, what: `${voiceName(voiceOf(candidate))} · reference ${label(candidate)}: ${data.candidates[candidate].reference.texts.join(' / ')}` })
const takeItem = (candidate, run, sentence) => {
  const take = data.sentences[sentence].takes[candidate][run]
  return { url: take?.url, color: colorOf(candidate), key: `take-${candidate}-${run}-${sentence}`, what: `${voiceName(voiceOf(candidate))} · ${label(candidate)}, ${data.candidates[candidate].runs[run]} · ${data.sentences[sentence].text}${take ? ` — heard: ${take.transcript}` : ''}` }
}
const sentencesOf = (candidate) => data.sentences.map((_, sentence) => takeItem(candidate, 0, sentence))

function heat(value) {
  const style = getComputedStyle(document.documentElement)
  const parse = (name) => style.getPropertyValue(name).trim().match(/[0-9a-f]{2}/gi).map((hex) => parseInt(hex, 16))
  const [a, b] = [parse('--heat-low'), parse('--heat-high')]
  const share = Math.max(0, Math.min(1, (value - SCALE.low) / (SCALE.high - SCALE.low)))
  return { background: `rgb(${a.map((channel, index) => Math.round(channel + (b[index] - channel) * share)).join(',')})`, dark: (a[0] > 128) === (share > 0.5) }
}

/** The other voice whose chosen candidate sounds most like this voice's, with their similarity. */
function nearest(voice) {
  const mine = chosenOf(voice)
  return data.voices.map((_, other) => ({ other, value: other === voice ? -Infinity : data.similarity[mine][chosenOf(other)] ?? -Infinity })).sort((a, b) => b.value - a.value)[0]
}

const compare = (a, b) => play([takeItem(chosenOf(a), 0, data.sample), takeItem(chosenOf(b), 0, data.sample)])

function figures(candidate) {
  const c = data.candidates[candidate]
  return [
    element('td', { className: judge(c.sameVoice, LIMITS.sameGood, LIMITS.sameBad, true), textContent: fixed(c.sameVoice) }),
    element('td', { className: judge(c.likeReference, LIMITS.sameGood, LIMITS.sameBad, true), textContent: fixed(c.likeReference) }),
    element('td', { className: judge(c.heardErrorRate, LIMITS.cerGood, LIMITS.cerBad, false), textContent: percent(c.heardErrorRate) }),
    element('td', { className: c.broken === 0 ? 'good' : 'bad', textContent: String(c.broken) }),
    element('td', { textContent: c.pitchHz ? `${Math.round(c.pitchHz)} Hz` : '–' })
  ]
}
const FIGURE_HEADS = ['Same voice', 'Like its reference', 'Heard CER', 'Broken', 'Pitch']

function renderVoices() {
  const rows = data.voices.map((voice, index) => {
    const chosen = chosenOf(index)
    const chips = element('div', { className: 'chips' }, voice.candidates.map((candidate) => {
      const chip = element('button', { className: `chip${candidate === chosen ? ' chosen' : ''}`, title: `${data.candidates[candidate].name}${candidate === voice.best ? ' — did best: the fewest broken sentences, then the most alike takes' : ''}`, onclick: () => choose(index, candidate) }, [label(candidate)])
      if (candidate === voice.best) chip.append(element('span', { className: 'best', textContent: ' ●' }))
      chip.style.setProperty('--color', colorOf(candidate))
      return chip
    }))
    const { other, value } = nearest(index)
    const near = element('td', { className: value >= LIMITS.alike ? 'bad' : '' }, [
      element('button', { textContent: `${fixed(value)} ${voiceName(other)}`, title: `Play the same sentence in this voice and in ${voiceName(other)}`, onclick: () => compare(index, other) })
    ])
    const row = element('tr', { className: index === selected ? 'selected' : '' }, [
      element('td', { className: 'name' }, [element('button', { textContent: voice.name, title: 'Hear the candidates of this voice sentence by sentence', onclick: () => { selected = index; render(); $('detail').scrollIntoView({ behavior: 'smooth' }) } })]),
      element('td', {}, [chips]),
      ...figures(chosen),
      near,
      element('td', {}, [element('div', { className: 'actions' }, [
        element('button', { textContent: '▶ Reference', onclick: () => play([referenceItem(chosen)]) }),
        element('button', { textContent: '▶ Sentences', onclick: () => play(sentencesOf(chosen)) })
      ])])
    ])
    return row
  })
  const lines = data.voices.map((voice, index) => `${voice.name}: ${data.candidates[chosenOf(index)].name}`).join('\n')
  $('voices').replaceChildren(
    element('div', { className: 'head' }, [
      element('h2', { textContent: `${data.voices.length} voices` }),
      element('button', { textContent: 'Copy the choices', onclick: () => navigator.clipboard?.writeText(lines).catch(() => {}) })
    ]),
    element('div', { className: 'scroll' }, [element('table', {}, [
      element('thead', {}, [element('tr', {}, ['Voice', 'Candidate', ...FIGURE_HEADS, 'Most alike voice', ''].map((text) => element('th', { textContent: text })))]),
      element('tbody', {}, rows)
    ])]),
    element('p', { className: 'legend', textContent: `The figures are of the chosen candidate, over every sentence of every seed it spoke. Same voice: the mean similarity of the speaker embeddings (3D-Speaker ERes2NetV2) of every pair of its takes with 1.5 s of voice or more. Like its reference: the mean similarity of its takes to the reference it spoke like. Broken: takes heard with more than 30% of their characters wrong. ● marks the candidate that did best: the fewest broken takes, then the most alike. Most alike voice: the other voice whose chosen candidate is most like this one; red at ${LIMITS.alike} or more, where takes of one description were heard as one voice.` }),
    element('pre', { textContent: lines })
  )
}

function renderAlike() {
  const head = element('tr', {}, [element('th', { textContent: '' }), ...data.voices.map((_, index) => element('th', { textContent: String(index + 1), title: data.voices[index].name }))])
  const rows = data.voices.map((voice, row) => element('tr', {}, [
    element('th', { className: 'row', textContent: `${row + 1} ${voice.name}` }),
    ...data.voices.map((_, column) => {
      const value = data.similarity[chosenOf(row)][chosenOf(column)]
      const cell = element('td', { className: `cell${row === column ? ' self' : value >= LIMITS.alike ? ' alike' : ''}`, textContent: fixed(value), title: row === column ? `${voice.name}: how alike its own takes are` : `${voice.name} and ${data.voices[column].name}: click to hear the same sentence in both` })
      if (value !== null) {
        const { background, dark } = heat(value)
        cell.style.background = background
        cell.style.color = dark ? '#ffffff' : '#1d1d1b'
      }
      if (row !== column) cell.onclick = () => compare(row, column)
      return cell
    })
  ]))
  $('alike').replaceChildren(
    element('div', { className: 'head' }, [element('h2', { textContent: 'How alike the chosen voices are' }), element('span', { className: 'muted', textContent: 'Click a cell to hear the same sentence in both voices.' })]),
    element('div', { className: 'scroll' }, [element('table', { className: 'matrix' }, [element('thead', {}, [head]), element('tbody', {}, rows)])]),
    element('p', { className: 'legend', textContent: `The mean similarity of every take of one voice with every take of the other; on the diagonal, of every pair of one voice's takes. Outlined at ${LIMITS.alike} or more.` })
  )
}

function renderDetail() {
  const voice = data.voices[selected]
  const chosen = chosenOf(selected)
  const rows = voice.candidates.map((candidate) => {
    const c = data.candidates[candidate]
    const reference = element('button', { textContent: '▶ Reference', onclick: () => play([referenceItem(candidate)]) })
    reference.dataset.key = `reference-${candidate}`
    const row = element('tr', { className: candidate === chosen ? 'selected' : '' }, [
      element('td', { className: 'name', textContent: `${label(candidate)}${candidate === voice.best ? ' ●' : ''}`, title: c.name }),
      ...figures(candidate),
      element('td', { className: 'muted', textContent: `${c.reference.seconds.toFixed(1)} s: ${c.reference.texts.join(' / ')}` }),
      element('td', {}, [element('div', { className: 'actions' }, [
        reference,
        element('button', { textContent: candidate === chosen ? 'Chosen' : 'Choose', disabled: candidate === chosen, onclick: () => choose(selected, candidate) })
      ])])
    ])
    row.firstChild.style.color = colorOf(candidate)
    return row
  })
  $('detail').replaceChildren(
    element('div', { className: 'head' }, [
      element('h2', { textContent: `Candidates of ${voice.name}` }),
      element('button', { textContent: '▶ Every reference', onclick: () => play(voice.candidates.map(referenceItem)) })
    ]),
    element('div', { className: 'scroll' }, [element('table', {}, [
      element('thead', {}, [element('tr', {}, ['', ...FIGURE_HEADS, 'Reference', ''].map((text) => element('th', { textContent: text })))]),
      element('tbody', {}, rows)
    ])])
  )
  $('sentences').replaceChildren(...data.sentences.map((sentence, index) => {
    const takes = voice.candidates.flatMap((candidate) => data.candidates[candidate].runs.map((run, which) => {
      const take = sentence.takes[candidate][which]
      const details = element('small')
      if (take) {
        const broken = take.heardErrorRate > LIMITS.broken
        details.append(`${take.seconds.toFixed(1)} s${take.pitchHz ? ` · ${Math.round(take.pitchHz)} Hz` : ''}${take.likeReference === null ? '' : ` · like its reference ${take.likeReference.toFixed(2)}`} · `,
          element('span', { className: broken ? 'bad' : '', textContent: `CER ${percent(take.heardErrorRate)}` }))
      } else details.textContent = 'not spoken'
      const button = element('button', { className: `take${candidate === chosen ? ' chosen' : ''}`, disabled: !take, title: take ? `heard: ${take.transcript}` : '', onclick: () => play([takeItem(candidate, which, index)]) }, [element('b', { textContent: `▶ ${label(candidate)} · ${run}` }), details])
      button.dataset.key = `take-${candidate}-${which}-${index}`
      button.style.setProperty('--color', colorOf(candidate))
      return button
    }))
    return element('section', { className: 'card' }, [
      element('div', { className: 'head' }, [
        element('span', { className: 'muted', textContent: `${index + 1} of ${data.sentences.length} · ${sentence.kind} · ${sentence.id}` }),
        element('button', { textContent: '▶ Every candidate', onclick: () => play(voice.candidates.map((candidate) => takeItem(candidate, 0, index))) })
      ]),
      element('p', { className: 'text', textContent: sentence.text }),
      element('div', { className: 'takes' }, takes)
    ])
  }))
}

function render() {
  renderVoices()
  renderAlike()
  renderDetail()
}

$('title').textContent = data.title
$('shared').textContent = [data.shared, `${data.voices.length} voices, ${data.candidates.length} candidates, ${data.sentences.length} sentences`].filter(Boolean).join(' · ')
$('stop').onclick = stop
document.addEventListener('keydown', (event) => { if (event.key === 'Escape') stop() })
render()
</script>
</body>
</html>
